{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Usuarios — Alke Wallet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">⬡ Alke Wallet</a>
        <a href="{% url 'crear_usuario' %}" class="btn btn-primary-custom">+ Nuevo Usuario</a>
      </div>
    </nav>

    <div class="container py-5">
      <h2 class="mb-4" style="color: var(--alke-accent)">Usuarios registrados</h2>
      <div class="row g-4">
        {% for usuario in usuarios %}
        <div class="col-md-4">
          <div class="card-feature p-4 rounded-4">
            <h5 class="fw-bold" style="color: var(--alke-accent)">{{ usuario.nombre }}</h5>
            <p class="mb-1" style="color: #ccc">📧 {{ usuario.email }}</p>
            <p class="mb-3" style="color: #ccc">💰 ${{ usuario.saldo }}</p>
            <div class="d-flex gap-2">
              <a href="{% url 'editar_usuario' usuario.id %}" class="btn btn-outline-custom btn-sm"
                >Editar</a
              >
              <a
                href="{% url 'eliminar_usuario' usuario.id %}"
                class="btn btn-sm"
                style="border: 2px solid #ff6b6b; color: #ff6b6b; border-radius: 25px"
                onclick="return confirm('¿Seguro que querés eliminar este usuario?');"
                >Eliminar</a
              >
            </div>
          </div>
        </div>
        {% empty %}
        <p style="color: #ccc">No hay usuarios registrados aún.</p>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
