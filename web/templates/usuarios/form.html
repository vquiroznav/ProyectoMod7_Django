{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Usuario — Alke Wallet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">⬡ Alke Wallet</a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card-feature p-5 rounded-4">
            <h2 class="mb-4 text-center" style="color: var(--alke-accent)">
              {% if usuario %}Editar Usuario{% else %}Nuevo Usuario{% endif %}
            </h2>
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label style="color: #ccc">Nombre</label>
                <input
                  type="text"
                  name="nombre"
                  class="form-control mt-1"
                  value="{{ usuario.nombre }}"
                  style="background: #0d0d1a; color: white; border-color: #6c2bd9"
                />
              </div>
              <div class="mb-3">
                <label style="color: #ccc">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control mt-1"
                  value="{{ usuario.email }}"
                  style="background: #0d0d1a; color: white; border-color: #6c2bd9"
                />
              </div>
              <div class="mb-4">
                <label style="color: #ccc">Saldo inicial</label>
                <input
                  type="number"
                  name="saldo"
                  step="0.01"
                  class="form-control mt-1"
                  value="{{ usuario.saldo }}"
                  style="background: #0d0d1a; color: white; border-color: #6c2bd9"
                />
              </div>
              <div class="d-flex gap-3 justify-content-center">
                <button type="submit" class="btn btn-primary-custom px-4">Guardar</button>
                <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-custom px-4"
                  >Cancelar</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
